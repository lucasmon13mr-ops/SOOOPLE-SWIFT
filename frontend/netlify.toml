# Configuração de deploy para a Netlify
#
# IMPORTANTE: Este projeto é só o FRONTEND (site). O backend real da API
# (que guarda pacotes, licenças, dispositivos, compila os projetos Theos etc.)
# não estava incluído no arquivo ZIP enviado — ele roda em outro servidor
# (o mesmo que hoje responde em https://api.zolmeaapi.shop).
#
# Todo o site chama endpoints relativos, tipo /api/auth/login, /api/packages,
# /api/project-builder/upload etc. Para esses caminhos funcionarem quando o
# site estiver hospedado na Netlify, é preciso redirecionar (fazer proxy)
# de /api/* e /audio/* para o servidor real do backend.
#
# Troque a URL abaixo pela URL real do seu backend antes de publicar.

[build]
  publish = "."

[[redirects]]
  from = "/api/*"
  to = "https://SEU-BACKEND-AQUI.exemplo.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/audio/*"
  to = "https://SEU-BACKEND-AQUI.exemplo.com/audio/:splat"
  status = 200
  force = true
