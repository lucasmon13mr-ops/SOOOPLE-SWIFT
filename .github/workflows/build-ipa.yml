name: Build IPA

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar 3V API (iOS)
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mostrar versão do Xcode
        run: xcodebuild -version

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Gerar projeto Xcode
        run: xcodegen generate --spec project.yml

      - name: Compilar (Release, sem assinatura)
        run: |
          set -euo pipefail
          xcodebuild \
            -project ThreeV.xcodeproj \
            -scheme ThreeV \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Empacotar IPA (sem assinatura)
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)"
          echo "App: $APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry ThreeV-unsigned.ipa Payload
          ls -lh ThreeV-unsigned.ipa
          shasum -a 256 ThreeV-unsigned.ipa | tee ThreeV-unsigned.ipa.sha256

      - name: Assinar IPA (opcional, se os secrets existirem)
        if: ${{ github.event_name != 'pull_request' }}
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          MOBILEPROVISION_BASE64: ${{ secrets.MOBILEPROVISION_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${P12_BASE64:-}" ] || [ -z "${MOBILEPROVISION_BASE64:-}" ]; then
            echo "Secrets de assinatura ausentes: seguindo com o IPA sem assinatura."
            exit 0
          fi

          echo "$P12_BASE64" | base64 --decode > /tmp/cert.p12
          echo "$MOBILEPROVISION_BASE64" | base64 --decode > /tmp/profile.mobileprovision

          KEYCHAIN=/tmp/signing.keychain-db
          security create-keychain -p actions "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p actions "$KEYCHAIN"
          security import /tmp/cert.p12 -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp /tmp/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

          TEAM_ID="$(security cms -D -i /tmp/profile.mobileprovision | /usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' /dev/stdin)"
          PROFILE_NAME="$(security cms -D -i /tmp/profile.mobileprovision | /usr/libexec/PlistBuddy -c 'Print :Name' /dev/stdin)"

          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>development</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.zolmea.threev</key><string>${PROFILE_NAME}</string>
            </dict>
            <key>stripSwiftSymbols</key><true/>
            <key>compileBitcode</key><false/>
          </dict>
          </plist>
          EOF

          xcodebuild -project ThreeV.xcodeproj -scheme ThreeV -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            build

          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)"
          rm -rf Payload && mkdir -p Payload && cp -R "$APP_PATH" Payload/
          rm -f ThreeV-signed.ipa
          zip -qry ThreeV-signed.ipa Payload
          ls -lh ThreeV-signed.ipa

      - name: Publicar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: ThreeV-IPA
          path: |
            ThreeV-*.ipa
            ThreeV-*.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publicar IPA direto em uma Release
        if: ${{ github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="ipa-build-${GITHUB_RUN_NUMBER}"
          FILES=(ThreeV-unsigned.ipa ThreeV-unsigned.ipa.sha256)
          if [ -f ThreeV-signed.ipa ]; then
            FILES+=(ThreeV-signed.ipa)
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "3V API IPA build #${GITHUB_RUN_NUMBER}" \
            --notes "IPA gerado automaticamente. O arquivo unsigned precisa ser assinado com AltStore, SideStore, Sideloadly, ESign ou Scarlet antes da instalação." \
            "${FILES[@]}"
